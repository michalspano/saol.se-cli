name: Codebase build

# Build and test every branch (main and feature branches alike), every pull
# request, and on demand from the Actions tab. `**` also matches branch names
# containing slashes, e.g. `3-feature/add-support-for-nouns`.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

# Cancel superseded runs on feature branches; keep every run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        # Use the Go version declared in `go.mod`.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go version
      - name: Build
        run: make build
        # The tests query the live SAOL API.
      - name: Test
        run: make test
